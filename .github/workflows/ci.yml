name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job here only reads the repository. Nothing needs to
# write, publish, or mint a token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, bun ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result instead of stopping at the first failure:
      # a Windows-only break should not hide a macOS one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `latest` is the current release. The pinned entry is the floor this
        # project claims in package.json (`engines.bun`), which is 1.4.0 because
        # the committed bun.lock is text lockfile format version 2 - Bun 1.2 and
        # 1.3 reject it outright with "Unknown lockfile version".
        bun: [latest, "1.4.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test with coverage
        run: bun test --coverage

      - name: Build
        run: bun build ./src/cli/index.ts --target=bun --outdir=dist
