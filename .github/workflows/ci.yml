name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job here only reads the repository. Nothing needs to
# write, publish, or mint a token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: workflow yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A workflow file with invalid YAML does not fail loudly: GitHub refuses to
      # run it and the repository just looks quiet. That is exactly how a broken
      # release.yml reached main, so parse them here instead.
      - name: Parse every workflow file
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import glob
          import yaml

          for path in sorted(glob.glob(".github/workflows/*.yml")):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"ok: {path}")
          PY

  test:
    name: test (${{ matrix.os }}, bun ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result instead of stopping at the first failure:
      # a Windows-only break should not hide a macOS one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `latest` is the current release. The pinned entry is the floor this
        # project claims in package.json (`engines.bun`), which is 1.4.0 because
        # the committed bun.lock is text lockfile format version 2 - Bun 1.2 and
        # 1.3 reject it outright with "Unknown lockfile version".
        bun: [latest, "1.4.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        # Bun 1.4's coverage mode exits 1 despite a passing suite and a complete
        # report. Run the test suite directly; coverage remains available locally.
        run: bun test

      - name: Build
        run: bun build ./src/cli/index.ts --target=bun --outdir=dist

  action:
    name: action self test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The action is used exactly as a consumer would use it, from source.
      # A composite action that does not run is not a delivered feature.
      - name: Run bunready through its own action
        uses: ./
        with:
          version: local
          path: .
          upload: "false"
          sarif-file: bunready-action.sarif

      - name: Assert the action produced a SARIF report
        run: |
          set -euo pipefail
          test -s bunready-action.sarif
          python3 -c "import json,sys; doc=json.load(open('bunready-action.sarif')); assert doc['version'] == '2.1.0', doc['version']; print('sarif 2.1.0 with', len(doc['runs'][0]['results']), 'results')"
