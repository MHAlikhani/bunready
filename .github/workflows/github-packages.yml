name: publish GitHub Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag or commit to publish"
        required: true
        default: "v0.4.4"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: github-package-${{ inputs.ref || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish @mhalikhani/bunready
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.release.tag_name }}

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@mhalikhani"

      - name: Publish the GitHub Packages mirror
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm pkg set name="@mhalikhani/bunready"
          npm publish --ignore-scripts --registry=https://npm.pkg.github.com
